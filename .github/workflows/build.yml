name: build

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      xray:
        type: string
        required: false
        default: ''
      publish:
        type: boolean
        required: false
        default: true
      revision:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: AndroidLibXrayLite tag to build, for example v26.9.30
        required: true
      xray:
        description: Optional Xray-core tag, branch or commit to build into that wrapper, for example v26.10.1 or main
        required: false
        default: ''
      publish:
        description: Publish a GitHub release
        type: boolean
        default: true
      revision:
        description: Optional rebuild number for a version that is already released, for example 1 publishes 26.10.10-r1-slim
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  attestations: write
  id-token: write

concurrency:
  group: build-${{ inputs.tag }}-${{ inputs.xray }}-${{ inputs.revision }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      XRAY: ${{ inputs.xray }}
    steps:
      - uses: actions/checkout@v7

      - name: Load the pinned versions
        run: cat versions.env >> "$GITHUB_ENV"

      - name: Clone upstream
        run: git clone --depth 1 --branch "$TAG" https://github.com/2dust/AndroidLibXrayLite upstream/AndroidLibXrayLite

      - name: Check that the pinned Go is new enough
        run: |
          required=$(awk '$1 == "go" { print $2; exit }' upstream/AndroidLibXrayLite/go.mod)
          newest=$(printf '%s\n%s\n' "$required" "$GO_VERSION" | sort -V | tail -n 1)
          if [ "$newest" != "$GO_VERSION" ]; then
            echo "::error::$TAG needs Go $required, versions.env pins $GO_VERSION. Raise GO_VERSION and run the build again."
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Install the NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: ./build-aar.sh "$TAG" "$XRAY"
        env:
          LIBV2RAY_SRC: ${{ github.workspace }}/upstream/AndroidLibXrayLite
          LIBV2RAY_WORK: ${{ runner.temp }}/libv2ray-build
          LIBV2RAY_REVISION: ${{ inputs.revision }}

      - name: Compare the size with the previous release
        run: |
          previous=$(gh release list --limit 20 --json tagName --jq '.[].tagName' | grep -e '-slim$' | head -n 1 || true)
          [ -n "$previous" ] || exit 0
          pattern='s/^`libgojni.so` (arm64-v8a): \([0-9]*\) bytes.*/\1/p'
          old=$(gh release view "$previous" --json body --jq .body | sed -n "$pattern" | head -n 1)
          new=$(sed -n "$pattern" dist/RELEASE_NOTES.md | head -n 1)
          [ -n "$old" ] && [ -n "$new" ] || exit 0
          awk -v prev="$previous" -v old="$old" -v new="$new" 'BEGIN { printf "\n### Compared with %s\n\narm64-v8a library: %+d bytes (%+.1f%%).\n", prev, new - old, 100 * (new - old) / old }' >> dist/RELEASE_NOTES.md

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.aar
            dist/*.pom
            dist/SHA256SUMS
            dist/THIRD_PARTY_LICENSES.txt

      - uses: actions/upload-artifact@v7
        with:
          name: libv2ray-slim-${{ inputs.xray || inputs.tag }}${{ inputs.revision && format('-r{0}', inputs.revision) || '' }}
          path: dist/*

      - name: Publish the release
        if: inputs.publish
        run: |
          aar=$(ls dist/libv2ray-*-slim.aar)
          version=${aar##*libv2ray-}
          version=${version%.aar}
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "Release v$version already exists" >&2
            exit 1
          fi
          gh release create "v$version" "$aar" "dist/libv2ray-$version.pom" dist/SHA256SUMS dist/THIRD_PARTY_LICENSES.txt \
            --title "$version" --notes-file dist/RELEASE_NOTES.md

      - name: Update the README
        id: readme
        continue-on-error: true
        env:
          PUBLISH: ${{ inputs.publish }}
          UPSTREAM_DIR: ${{ runner.temp }}/upstream-aar
        run: |
          gh release download "$TAG" --repo 2dust/AndroidLibXrayLite --pattern libv2ray.aar --dir "$UPSTREAM_DIR"
          go run tools/readme/main.go -upstream "$UPSTREAM_DIR/libv2ray.aar"
          if [ -z "$(git status --porcelain -- README.md docs)" ]; then
            exit 0
          fi
          git --no-pager diff --stat -- README.md docs
          git --no-pager diff -- README.md | head -n 120
          latest=$(gh api repos/2dust/AndroidLibXrayLite/releases/latest --jq .tag_name)
          if [ "$PUBLISH" != true ] || [ -n "$XRAY" ] || [ "$latest" != "$TAG" ]; then
            echo "Not committing the README: publish=$PUBLISH, xray='$XRAY', latest upstream=$latest, built=$TAG"
            exit 0
          fi
          aar=$(ls dist/libv2ray-*-slim.aar)
          version=${aar##*libv2ray-}
          version=${version%.aar}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs
          git commit -m "Update the README for $version"
          for _ in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Open an issue when the README update fails
        if: steps.readme.outcome == 'failure' && inputs.publish
        run: |
          title="README update failed for $TAG"
          if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" --body "The release was published, but tools/readme could not update the README: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Open an issue when the build fails
        if: failure() && inputs.publish
        run: |
          title="Build failed for $TAG ${XRAY:+with Xray-core $XRAY}"
          if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" --body "The build did not finish: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
