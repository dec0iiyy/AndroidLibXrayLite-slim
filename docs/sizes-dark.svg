<svg xmlns="http://www.w3.org/2000/svg" width="760" height="308" viewBox="0 0 760 308" role="img" aria-labelledby="title desc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="title">Native library per ABI, compressed</title>
<desc id="desc">Compressed libgojni.so per ABI, upstream v26.11.26 against slim 26.11.26-slim. Smaller is better.</desc>
<text x="24" y="36" font-size="18" font-weight="600" fill="#e6edf3">Native library per ABI, compressed</text>
<text x="24" y="58" font-size="13" fill="#8d96a0">upstream v26.11.26 against slim 26.11.26-slim, smaller is better</text>
<text x="24" y="114" font-size="14" font-weight="600" fill="#e6edf3">arm64-v8a</text>
<rect x="132" y="92" width="433.2" height="18" rx="4" fill="#484f58"/>
<text x="573.2" y="105" font-size="13" fill="#8d96a0">12.3 MB</text>
<rect x="132" y="116" width="377.8" height="18" rx="4" fill="#3fb950"/>
<text x="517.8" y="129" font-size="13" font-weight="600" fill="#e6edf3">10.8 MB  <tspan fill="#3fb950">−13%</tspan></text>
<text x="24" y="174" font-size="14" font-weight="600" fill="#e6edf3">armeabi-v7a</text>
<rect x="132" y="152" width="453.6" height="18" rx="4" fill="#484f58"/>
<text x="593.6" y="165" font-size="13" fill="#8d96a0">12.9 MB</text>
<rect x="132" y="176" width="401.4" height="18" rx="4" fill="#3fb950"/>
<text x="541.4" y="189" font-size="13" font-weight="600" fill="#e6edf3">11.4 MB  <tspan fill="#3fb950">−12%</tspan></text>
<text x="24" y="234" font-size="14" font-weight="600" fill="#e6edf3">x86_64</text>
<rect x="132" y="212" width="470.0" height="18" rx="4" fill="#484f58"/>
<text x="610.0" y="225" font-size="13" fill="#8d96a0">13.4 MB</text>
<rect x="132" y="236" width="410.5" height="18" rx="4" fill="#3fb950"/>
<text x="550.5" y="249" font-size="13" font-weight="600" fill="#e6edf3">11.7 MB  <tspan fill="#3fb950">−13%</tspan></text>
<rect x="24" y="276" width="12" height="12" rx="3" fill="#484f58"/><text x="42" y="287" font-size="13" fill="#8d96a0">upstream</text>
<rect x="124" y="276" width="12" height="12" rx="3" fill="#3fb950"/><text x="142" y="287" font-size="13" fill="#8d96a0">slim</text>
