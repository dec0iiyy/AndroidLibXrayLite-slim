<text x="24" y="58" font-size="13" fill="#656d76">upstream v26.10.17 against slim 26.10.17-slim, smaller is better</text>
<text x="24" y="114" font-size="14" font-weight="600" fill="#1f2328">arm64-v8a</text>
<rect x="132" y="92" width="433.9" height="18" rx="4" fill="#afb8c1"/>
<text x="573.9" y="105" font-size="13" fill="#656d76">12.2 MB</text>
<rect x="132" y="116" width="375.1" height="18" rx="4" fill="#1a7f37"/>
<text x="515.1" y="129" font-size="13" font-weight="600" fill="#1f2328">10.5 MB  <tspan fill="#1a7f37">−14%</tspan></text>
<text x="24" y="174" font-size="14" font-weight="600" fill="#1f2328">armeabi-v7a</text>
<rect x="132" y="152" width="455.5" height="18" rx="4" fill="#afb8c1"/>
<text x="595.5" y="165" font-size="13" fill="#656d76">12.8 MB</text>
<rect x="132" y="176" width="399.2" height="18" rx="4" fill="#1a7f37"/>
<text x="539.2" y="189" font-size="13" font-weight="600" fill="#1f2328">11.2 MB  <tspan fill="#1a7f37">−12%</tspan></text>
<text x="24" y="234" font-size="14" font-weight="600" fill="#1f2328">x86_64</text>
<rect x="132" y="212" width="470.0" height="18" rx="4" fill="#afb8c1"/>
<text x="610.0" y="225" font-size="13" fill="#656d76">13.2 MB</text>
<rect x="132" y="236" width="407.3" height="18" rx="4" fill="#1a7f37"/>
<text x="547.3" y="249" font-size="13" font-weight="600" fill="#1f2328">11.4 MB  <tspan fill="#1a7f37">−13%</tspan></text>
<rect x="24" y="276" width="12" height="12" rx="3" fill="#afb8c1"/><text x="42" y="287" font-size="13" fill="#656d76">upstream</text>
